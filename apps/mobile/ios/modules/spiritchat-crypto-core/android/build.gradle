// The Android half of the native module. Its iOS counterpart is compiled
// by Xcode straight from `ios/`; here Gradle has to be told three things
// that do not come for free.
//
// First, where the Rust lives. `packages/crypto-core-ffi` is built for
// Android by `scripts/build-android-native.sh` — cargo-ndk produces one
// `.so` per ABI and uniffi-bindgen writes the Kotlin that calls into it.
// Neither is checked in (both are build outputs of a source tree that is),
// so both land in `generated/` and are wired in below rather than sitting
// in `src/`, where they would look hand-written and get edited as if they
// were.
//
// Second, JNA. The generated bindings reach the library through JNA rather
// than registering JNI methods by hand, so the AAR flavour of it has to be
// on the classpath — the `@aar` suffix is load-bearing, the plain jar has
// no Android native loader and fails at runtime, not at build time.
//
// Third, the Expo module plugin, which is what makes `Name(...)` in the
// module class resolvable from JavaScript.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.spiritchatcryptocore'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()

android {
  namespace 'expo.modules.spiritchatcryptocore'
  // 35 and 33 to match the Compose app that already loads this same
  // library successfully, so there is one answer to "which Android does
  // the Rust core run on" rather than two that can drift apart.
  compileSdk 35

  defaultConfig {
    minSdk 33
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  sourceSets {
    main {
      // Build outputs, not sources — see the note at the top.
      java.srcDirs += 'generated/java'
      jniLibs.srcDirs += 'generated/jniLibs'
    }
  }
}

dependencies {
  implementation 'net.java.dev.jna:jna:5.14.0@aar'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
