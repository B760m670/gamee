[package]
name = "spiritchat-p2p-core"
version = "0.1.0"
edition = "2021"
description = "Serverless peer-to-peer transport for SpiritChat: no relay, no VPS, no infrastructure this project operates. Peers find each other via local mDNS and the public IPFS Kademlia DHT (the same shared, already-running network millions of libp2p/IPFS nodes use), connect directly or through peer-run circuit relays with hole-punching, and exchange already end-to-end-encrypted envelopes and content-addressed blobs (e.g. avatars) produced by spiritchat-crypto-core, served directly from each device rather than hosted anywhere."

[dependencies]
# `rsa` is not an optional extra here, it is what makes the public IPFS
# bootstrap set reachable at all.
#
# Every one of the four bootstrap peers has a `Qm…` peer id, which is a
# multihash of an **RSA** public key (the modern `12D3Koo…` form is
# Ed25519). Without this feature, libp2p-identity cannot decode their
# keys, so the handshake fails on every single one with "Invalid public
# key: Key decoding error: cargo feature `rsa` is not enabled" — a node
# that resolves them, reaches them, and still never joins the DHT.
#
# Their advertised addresses also include `/wss/` entries, which this
# build rejects as "Unsupported resolved address". Deliberately left that
# way: the builder's `with_websocket` is async, so adding it would make
# swarm construction async and ripple through the FFI and Swift callers,
# and those peers advertise plain `/tcp/4001` and `/quic-v1` addresses
# too — the wss ones are redundant dial candidates, not the only route.
libp2p = { version = "0.56", features = ["tcp", "quic", "dns", "noise", "yamux", "kad", "mdns", "identify", "relay", "dcutr", "request-response", "gossipsub", "cbor", "macros", "tokio", "rsa"] }
spiritchat-ledger-core = { path = "../ledger-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1"
sha2 = "0.10"
hkdf = "0.12"
redb = "2"
sphinx-packet = "0.6"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Contact tickets are signed with the same identity key the rest of the
# project uses; same crate and version crypto-core already standardises on.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
# Only for `LookupIpStrategy`, which decides whether a DNS lookup returns
# A records, AAAA records, or both — see `build_swarm`. `libp2p::dns`
# re-exports `ResolverConfig`/`ResolverOpts` but not that enum, so it has
# to come from here. Same version and feature set libp2p-dns itself pins,
# so cargo unifies them into one crate rather than linking two resolvers.
hickory-resolver = { version = "0.25.2", features = ["system-config"], default-features = false }

[dev-dependencies]
tempfile = "3"
spiritchat-crypto-core = { path = "../crypto-core" }
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
