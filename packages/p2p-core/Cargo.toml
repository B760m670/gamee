[package]
name = "spiritchat-p2p-core"
version = "0.1.0"
edition = "2021"
description = "Serverless peer-to-peer transport for SpiritChat: no relay, no VPS, no infrastructure this project operates. Peers find each other via local mDNS and the public IPFS Kademlia DHT (the same shared, already-running network millions of libp2p/IPFS nodes use), connect directly or through peer-run circuit relays with hole-punching, and exchange already end-to-end-encrypted envelopes and content-addressed blobs (e.g. avatars) produced by spiritchat-crypto-core, served directly from each device rather than hosted anywhere."

[dependencies]
libp2p = { version = "0.56", features = ["tcp", "quic", "dns", "noise", "yamux", "kad", "mdns", "identify", "relay", "dcutr", "request-response", "gossipsub", "cbor", "macros", "tokio"] }
spiritchat-ledger-core = { path = "../ledger-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1"
sha2 = "0.10"
hkdf = "0.12"
redb = "2"
sphinx-packet = "0.6"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
spiritchat-crypto-core = { path = "../crypto-core" }
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
