[package]
name = "spiritchat-crypto-core-ffi"
version = "0.1.0"
edition = "2021"
description = "UniFFI bindings exposing spiritchat-crypto-core and spiritchat-p2p-core to Kotlin (Android/JNI) and Swift (iOS/C ABI). One FFI/XCFramework boundary for both — they're used together by the app and splitting the binding/build machinery in two would double the CI and podspec complexity for no real benefit; the Rust crates themselves stay separate."

[lib]
name = "spiritchat_crypto_core_ffi"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
spiritchat-crypto-core = { path = "../crypto-core" }
spiritchat-p2p-core = { path = "../p2p-core" }
spiritchat-ledger-core = { path = "../ledger-core" }
spiritchat-mls-core = { path = "../mls-core" }
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
sha2 = "0.10"
bincode = "1"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
