name: iOS Unsigned Build (SideStore)

# Produces an UNSIGNED .ipa for the iOS app. It is not code-signed by Apple —
# SideStore/AltStore sign it locally on-device with the user's own free
# Apple ID when sideloading, so no Apple Developer Program membership is
# needed on the CI side.
#
# Every run also publishes the .ipa plus an AltSource-format source.json to
# the "ios-dev" GitHub Release (stable URLs — see "Publish to iOS dev
# channel" below). Add that source.json's raw URL to LiveContainer's own
# Sources tab (Sources → + → paste URL) once, and LiveContainer will offer
# each new build as an in-app update from then on — same idea as the
# Android in-app updater, no manual re-download/re-import needed after the
# one-time setup.
#
# Runs automatically on changes to the iOS app or the shared Rust crypto
# core, or manually from the Actions tab.

on:
  push:
    branches:
      - claude/game-app-architecture-discussion-8gn7ep
    paths:
      - 'apps/mobile/ios/**'
      - 'packages/crypto-core/**'
      - 'packages/crypto-core-ffi/**'
      - 'packages/p2p-core/**'
      - 'packages/ledger-core/**'
      - '.github/workflows/ios-unsigned-build.yml'
  workflow_dispatch:
    inputs:
      distribution:
        description: >-
          Distribution channel to build for. "app-store" defines the
          SPIRITCHAT_APP_STORE Swift condition, which disables on-device
          ledger mining (App Review 3.1.5(b) — standing relays mine instead).
          "direct" is the sideload/LiveContainer build, which keeps mining.
        type: choice
        options: [direct, app-store]
        default: direct

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # The oldest iOS the app supports. 16.4 is the floor imposed by Expo SDK 57
  # (every `expo-modules-core`-based pod declares `:ios => '16.4'`); nothing in
  # the tree needs more. Keep this in sync with `expo-build-properties`'
  # `ios.deploymentTarget` in apps/mobile/ios/app.json — that setting is what
  # the Xcode project actually gets, this one pins the Rust slices and the
  # cache key to match.
  IOS_DEPLOYMENT_TARGET: '16.4'

jobs:
  build:
    runs-on: macos-15
    env:
      # Read by SpiritchatCryptoCore.podspec at `pod install` time to decide
      # whether to define the SPIRITCHAT_APP_STORE Swift condition. Defaults to
      # the sideload channel, so a plain push or a manual run with nothing
      # selected builds exactly what it built before. Job-level rather than
      # workflow-level so it can read the dispatch input.
      SPIRITCHAT_DISTRIBUTION: ${{ github.event.inputs.distribution || 'direct' }}
    defaults:
      run:
        working-directory: apps/mobile/ios
    steps:
      - uses: actions/checkout@v4

      - name: Select newest available Xcode (>= 16.1 required by RN 0.86)
        run: |
          ls /Applications | grep -i xcode
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          # Recorded for the DerivedData cache key below — restoring a build
          # cache produced by a different Xcode version onto this one is how
          # you get bizarre, hard-to-debug archive failures.
          echo "XCODE_VERSION=$(xcodebuild -version | head -1 | tr ' ' '_')" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust build (crypto-core-ffi)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/crypto-core-ffi/target
          # The deployment target is part of the key: it changes the code the
          # compiler emits, but no .rs file changes with it, so without this a
          # stale cache would silently keep slices built for the old minimum.
          key: rust-crypto-core-ffi-ios-${{ runner.os }}-ios${{ env.IOS_DEPLOYMENT_TARGET }}-${{ hashFiles('packages/crypto-core/**/*.rs', 'packages/crypto-core/Cargo.toml', 'packages/crypto-core-ffi/**/*.rs', 'packages/crypto-core-ffi/Cargo.toml', 'packages/p2p-core/**/*.rs', 'packages/p2p-core/Cargo.toml') }}
          restore-keys: |
            rust-crypto-core-ffi-ios-${{ runner.os }}-ios${{ env.IOS_DEPLOYMENT_TARGET }}-

      - name: Cross-compile crypto core for iOS (device + Apple Silicon simulator)
        working-directory: packages/crypto-core-ffi
        # Pinned to the same minimum the Xcode project uses (see
        # expo-build-properties in app.json) so the Rust static library's
        # LC_BUILD_VERSION matches the app's — otherwise the linker warns
        # about an object file built for a different iOS version, and the
        # effective floor becomes whichever slice is highest.
        env:
          IPHONEOS_DEPLOYMENT_TARGET: ${{ env.IOS_DEPLOYMENT_TARGET }}
        run: |
          cargo build --release --lib --target aarch64-apple-ios
          cargo build --release --lib --target aarch64-apple-ios-sim

      - name: Generate Swift bindings from the crypto core
        working-directory: packages/crypto-core-ffi
        run: |
          cargo build --bin uniffi-bindgen
          ./target/debug/uniffi-bindgen generate \
            --library target/aarch64-apple-ios-sim/release/libspiritchat_crypto_core_ffi.dylib \
            --language swift \
            --out-dir bindgen-out \
            --no-format

          MODULE_DIR=../../apps/mobile/ios/modules/spiritchat-crypto-core/ios
          cp bindgen-out/spiritchat_crypto_core_ffi.swift "$MODULE_DIR/"

          mkdir -p headers
          cp bindgen-out/spiritchat_crypto_core_ffiFFI.h headers/
          cp bindgen-out/spiritchat_crypto_core_ffiFFI.modulemap headers/module.modulemap

          rm -rf "$MODULE_DIR/SpiritchatCryptoCoreFFI.xcframework"
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libspiritchat_crypto_core_ffi.a -headers headers \
            -library target/aarch64-apple-ios-sim/release/libspiritchat_crypto_core_ffi.a -headers headers \
            -output "$MODULE_DIR/SpiritchatCryptoCoreFFI.xcframework"

      # `expo prebuild` + `pod install` regenerate the whole native project
      # from scratch every run (ios/ isn't committed) — even when nothing
      # that actually affects it changed. That defeats DerivedData caching
      # on its own: Xcode ties build-product validity to the specific
      # project file it saw last time, so a byte-different-but-equivalent
      # regenerated project still forces a full rebuild regardless of what's
      # sitting in DerivedData (confirmed: the DerivedData cache below only
      # shaved the Archive step by ~6% by itself). Caching the *entire*
      # generated ios/ directory and skipping regeneration outright when its
      # only real inputs — package.json, app.json, our own native module's
      # podspec/config, and the Rust FFI source that gets compiled into it —
      # haven't changed is what actually lets Xcode see the same project
      # twice and trust its cache. A change to any of those still forces a
      # full, correct regeneration; nothing here can serve stale native code.
      - name: Cache generated native iOS project
        id: native-project-cache
        uses: actions/cache@v4
        with:
          path: apps/mobile/ios/ios
          # The distribution channel belongs in the key: it changes the Swift
          # compilation conditions baked into the generated Pods project while
          # leaving every hashed file byte-identical, so without it an
          # app-store run could restore — and ship — a project configured for
          # the mining-enabled channel.
          key: native-ios-project-${{ runner.os }}-${{ env.SPIRITCHAT_DISTRIBUTION }}-${{ hashFiles('apps/mobile/ios/package.json', 'apps/mobile/ios/app.json', 'apps/mobile/ios/modules/**/*.podspec', 'apps/mobile/ios/modules/**/expo-module.config.json', 'apps/mobile/ios/modules/**/*.swift', 'packages/crypto-core/**/*.rs', 'packages/crypto-core/Cargo.toml', 'packages/crypto-core-ffi/**/*.rs', 'packages/crypto-core-ffi/Cargo.toml', 'packages/p2p-core/**/*.rs', 'packages/p2p-core/Cargo.toml') }}

      - name: Prebuild native iOS project
        if: steps.native-project-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform ios --no-install

      # Fallback caching for when the native project cache above *does*
      # miss (a real native-relevant change) — still saves time re-resolving
      # and re-downloading pods even though the project itself must be
      # regenerated.
      - name: Cache CocoaPods downloads
        if: steps.native-project-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            apps/mobile/ios/ios/Pods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('apps/mobile/ios/package.json', 'apps/mobile/ios/modules/**/*.podspec') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        if: steps.native-project-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/ios/ios
        run: pod install --repo-update

      # Deliberately not conditional on the pod-install step above: the case
      # worth catching is precisely the one where install was skipped and the
      # generated project came from a cache, since that is the only way a run
      # could end up archiving a project configured for the other channel.
      # Reads the same file Xcode will read, so this asserts what actually
      # reaches the compiler rather than what we intended to set.
      - name: Verify the distribution policy reached the project
        working-directory: apps/mobile/ios/ios
        run: |
          CONFIG="Pods/Target Support Files/SpiritchatCryptoCore/SpiritchatCryptoCore.release.xcconfig"
          if [ ! -f "$CONFIG" ]; then
            echo "::error::$CONFIG is missing — cannot verify the distribution policy"
            exit 1
          fi
          echo "Channel: $SPIRITCHAT_DISTRIBUTION"
          grep -F 'SWIFT_ACTIVE_COMPILATION_CONDITIONS' "$CONFIG" || true
          if grep -qF 'SPIRITCHAT_APP_STORE' "$CONFIG"; then PRESENT=yes; else PRESENT=no; fi
          if [ "$SPIRITCHAT_DISTRIBUTION" = "app-store" ] && [ "$PRESENT" != "yes" ]; then
            echo "::error::app-store build without SPIRITCHAT_APP_STORE — this binary would mine on device"
            exit 1
          fi
          if [ "$SPIRITCHAT_DISTRIBUTION" != "app-store" ] && [ "$PRESENT" = "yes" ]; then
            echo "::error::direct build carries SPIRITCHAT_APP_STORE — mining would be disabled unintentionally"
            exit 1
          fi
          echo "Distribution policy verified: SPIRITCHAT_APP_STORE present=$PRESENT"

      # Now that the project itself is stable across runs whenever possible
      # (see above), this can actually do what it was meant to: let Xcode's
      # own incremental build system skip recompiling any pod whose inputs
      # haven't changed, same as a local rebuild would, instead of starting
      # from nothing every time. Keyed on Podfile.lock so a real dependency
      # version bump still forces a full, correct rebuild.
      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ env.SPIRITCHAT_DISTRIBUTION }}-${{ hashFiles('apps/mobile/ios/ios/Podfile.lock') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ env.XCODE_VERSION }}-${{ env.SPIRITCHAT_DISTRIBUTION }}-

      - name: Detect Xcode scheme
        working-directory: apps/mobile/ios/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          APP_NAME=$(node -e "console.log(require('../app.json').expo.name)")
          echo "All schemes:"
          xcodebuild -list -json -workspace "$WORKSPACE" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).workspace.schemes.join('\n')))"
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | node -e "
            let d='';process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              const schemes = JSON.parse(d).workspace.schemes;
              const appName = '$APP_NAME';
              const exact = schemes.find(s => s === appName);
              if (exact) { console.log(exact); return; }
              const deny = ['Pods', 'EASClient', 'ExpoModulesCore', 'ExpoModulesJSI', 'React-Core-prebuilt', 'ReactNativeDependencies', 'React-RCTFBReactNativeSpec', 'hermes-engine'];
              const fallback = schemes.find(s => !deny.some(d => s.includes(d)));
              console.log(fallback || schemes[0]);
            })
          ")
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Detected workspace=$WORKSPACE app=$APP_NAME scheme=$SCHEME"

      - name: Archive (unsigned)
        working-directory: apps/mobile/ios/ios
        run: |
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned .ipa
        working-directory: apps/mobile/ios/ios
        run: |
          echo "Archive contents:"
          find build/App.xcarchive -maxdepth 4
          APP_PATH=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP_PATH"
          if [ -z "$APP_PATH" ]; then echo "::error::No .app found in archive"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y App-unsigned.ipa Payload
          mkdir -p ../dist
          mv App-unsigned.ipa ../dist/
          # Fail loudly if the shipped binary ended up with a higher floor
          # than intended — a silent bump here is exactly what makes the app
          # refuse to install on an older device.
          BUILT_MIN=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP_PATH/Info.plist")
          echo "MinimumOSVersion in the built app: $BUILT_MIN (expected $IOS_DEPLOYMENT_TARGET)"
          if [ "$BUILT_MIN" != "$IOS_DEPLOYMENT_TARGET" ]; then
            echo "::error::MinimumOSVersion is $BUILT_MIN, expected $IOS_DEPLOYMENT_TARGET"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: spiritchat-app-unsigned-ipa
          path: apps/mobile/ios/dist/App-unsigned.ipa
          retention-days: 14

      - name: Write LiveContainer/SideStore source manifest
        run: |
          VERSION="1.0.0-dev.${{ github.run_number }}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SIZE="$(stat -f%z dist/App-unsigned.ipa)"
          BUNDLE_ID="$(node -e "console.log(require('./app.json').expo.ios.bundleIdentifier)")"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/ios-dev/App-unsigned.ipa"
          # AltSource parsers disagree on where the download lives: older
          # ones (and AltStore itself) read the flat version/downloadURL/size
          # fields directly on the app object; newer ones (LiveContainer
          # included) read a per-version entry from a nested "versions"
          # array and error ("no IPA specified") if that array is missing or
          # empty, even with the flat fields present. Emitting both is a
          # pure superset, so every parser finds what it's looking for.
          cat > dist/source.json <<EOF
          {
            "name": "SpiritChat Dev",
            "identifier": "com.spiritchat.sources.ios-dev",
            "apps": [
              {
                "name": "SpiritChat",
                "bundleIdentifier": "$BUNDLE_ID",
                "developerName": "SpiritChat",
                "version": "$VERSION",
                "versionDate": "$DATE",
                "versionDescription": "${{ github.sha }}",
                "localizedDescription": "SpiritChat — decentralized end-to-end-encrypted messenger (unsigned dev build, sideloaded via SideStore/LiveContainer).",
                "downloadURL": "$DOWNLOAD_URL",
                "size": $SIZE,
                "minOSVersion": "$IOS_DEPLOYMENT_TARGET",
                "versions": [
                  {
                    "version": "$VERSION",
                    "date": "$DATE",
                    "localizedDescription": "${{ github.sha }}",
                    "downloadURL": "$DOWNLOAD_URL",
                    "size": $SIZE,
                    "minOSVersion": "$IOS_DEPLOYMENT_TARGET"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Publish to iOS dev channel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-dev
          name: iOS dev channel
          prerelease: true
          make_latest: false
          files: |
            apps/mobile/ios/dist/App-unsigned.ipa
            apps/mobile/ios/dist/source.json
